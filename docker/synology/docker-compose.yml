services:
  beta:
    image: ${DARKRIDE_IMAGE:?Set an immutable 1.1-beta image tag or digest}
    platform: linux/amd64
    network_mode: host
    user: "${PUID:-10001}:${PGID:-10001}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    stop_grace_period: 120s
    mem_limit: ${MEMORY_LIMIT:-2g}
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - type: bind
        source: ${DARKRIDE_DATA_DIR:?Set a new empty beta directory}
        target: /data
        bind:
          create_host_path: false
    environment:
      TIVOLI_APP_DATA_DIR: /data
      HIFI_DOMAIN_SERVER_HTTP_PORT: ${HTTP_PORT:-41100}
      HIFI_DOMAIN_SERVER_HTTPS_PORT: ${HTTPS_PORT:-41101}
      HIFI_DOMAIN_SERVER_PORT: ${DOMAIN_PORT:-41102}
      HIFI_DOMAIN_SERVER_DTLS_PORT: ${DTLS_PORT:-41103}
      AC_PORT_BASE: ${AC_PORT_BASE:-48100}
      HIFI_METAVERSE_URL: https://vr.darkride.ai
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
